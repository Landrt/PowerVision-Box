name: Build VoltCam Box APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Inject Google Services and Keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret is empty or not set in GitHub repository settings!"
            exit 1
          fi
          
          # Try to determine if the secret is base64 encoded by checking if it contains spaces or quotes (which base64 doesn't have)
          if echo "$GOOGLE_SERVICES_JSON" | grep -q "{"; then
            echo "Secret appears to be raw JSON. Saving directly."
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "Secret appears to be base64. Decoding."
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          fi
          
          echo "google-services.json size:"
          ls -l app/google-services.json
          
          if [ -n "$DEBUG_KEYSTORE" ]; then
            echo "$DEBUG_KEYSTORE" | base64 -d > debug.keystore
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoltCam-Box-Simulator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
