name: Build VoltCam Box APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Inject Google Services and Keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          # Create google-services.json in the app/ directory
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          
          # Create debug.keystore in the project root
          echo "$DEBUG_KEYSTORE" | base64 -d > debug.keystore

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoltCam-Box-Simulator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
